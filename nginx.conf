worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx_access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    # React visualization app + dynamically proxied user projects
    server {
        listen 3500;

        # Dynamically generated project proxies (written by start.sh)
        include /tmp/nginx_projects.conf;

        # YepAnywhere proxy — same CSP stripping as port 3401 but accessible
        # through port 3500 so only one port needs to be exposed locally.
        # YepAnywhere assets — more specific than /yep/, so nginx routes here
        # before the /yep/ block. No sub_filter or Accept-Encoding override,
        # which would cause YepAnywhere to return HTML fallback for asset requests.
        location ^~ /yep/assets/ {
            proxy_pass http://localhost:3400/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:3400";
            proxy_set_header Origin "http://localhost:3400";
        }

        location /yep/ {
            proxy_pass http://localhost:3400/;
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:3400";
            proxy_set_header Origin "http://localhost:3400";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Security-Policy;
            proxy_hide_header X-WebKit-CSP;
            proxy_hide_header X-Frame-Options;
            # Prevent Cloudflare from caching this HTML — sub_filter modifications
            # (asset path rewrites, yep-init.js injection) must always reach the browser.
            add_header Cache-Control "no-store";
            # Rewrite root-relative asset paths to /yep/assets/ so they route
            # through this location block (which correctly strips the /yep/ prefix).
            # Also bypasses any Cloudflare cache of old /assets/ 404 responses.
            # Strip YepAnywhere's CSP meta tag so our inline script isn't blocked.
            sub_filter 'http-equiv="Content-Security-Policy"' 'http-equiv="x-csp-disabled"';
            # Inline script executes synchronously at parse time — no fetch, no timing race.
            sub_filter '<head>' '<head><script>history.replaceState({},document.title,"/");</script>';
            sub_filter 'href="/assets/' 'href="/yep/assets/';
            sub_filter 'src="/assets/'  'src="/yep/assets/';
            sub_filter_once off;
        }

        # Static assets: serve from React app first, fall back to YepAnywhere.
        # This handles YepAnywhere's root-relative asset paths (/assets/...)
        # without breaking the React app's own assets.
        location ~* \.[a-z0-9]+$ {
            root /app/dist;
            try_files $uri @yepanywhere_assets;
        }

        location @yepanywhere_assets {
            proxy_pass http://localhost:3400;
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:3400";
            proxy_set_header Origin "http://localhost:3400";
        }

        # Injected as first script in YepAnywhere's <head>.
        # Resets pathname to "/" before React Router initialises — YepAnywhere's
        # routes expect to run at root, not at /yep/ where nginx proxies it.
        location = /yep-init.js {
            add_header Content-Type application/javascript;
            add_header Cache-Control "no-store";
            return 200 'history.replaceState({},document.title,"/");';
        }

        # ttyd web terminal — trailing slash strips /shell/ prefix so ttyd
        # receives paths at its root (e.g. /ws, /token) as it expects.
        location ^~ /shell/ {
            proxy_pass http://localhost:3700/;
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:3700";
            proxy_set_header Origin "http://localhost:3700";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Auth server API
        location /api/auth/ {
            proxy_pass http://localhost:3600/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # YepAnywhere WebSocket and API
        location /api/ {
            proxy_pass http://localhost:3400/api/;
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:3400";
            proxy_set_header Origin "http://localhost:3400";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            root /app/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
